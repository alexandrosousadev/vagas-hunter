# Configuração do vagas-hunter. Edite à vontade.

curriculo: curriculo/curriculo.pdf      # PDF ou DOCX

# Provedor de IA: "ollama" (local no PC) | "gemini" (nuvem grátis) | "groq" (nuvem grátis)
# Para subir na web depois, basta mudar provedor para "gemini" (ou "groq") e preencher a chave (ou usar variável de ambiente GEMINI_API_KEY / GROQ_API_KEY)
ia:
  provedor: ollama
  gemini_api_key: ""                       # crie grátis em https://aistudio.google.com/apikey
  gemini_modelo_chat: gemini-2.5-flash
  gemini_modelo_embed: text-embedding-004
  groq_api_key: ""                         # crie grátis em https://console.groq.com/keys
  groq_modelo_chat: llama-3.3-70b-versatile

ollama:
  url: http://localhost:11434
  modelo_chat: qwen2.5:7b                # troque por qwen2.5:3b se ficar lento
  modelo_embed: nomic-embed-text

# Complementa o perfil que a IA extrai do currículo (opcional)
perfil_extra:
  cargos: [Desenvolvedor Full Stack, Desenvolvedor Backend, Desenvolvedor PHP, Desenvolvedor Java, Desenvolvedor Front-end, Desenvolvedor Mobile, Desenvolvedor React Native, Analista de Suporte]
  skills: [PHP, Java, Angular, React, React Native, Mobile, JavaScript, TypeScript, MySQL, PostgreSQL, Git, APIs REST, Suporte Técnico]
  senioridade: junior                    # estagio | junior | pleno | senior

# Títulos com estas palavras são descartados sem gastar IA
excluir_titulos: [pleno, pl, mid, "mid level", "mid-level", "ii", senior, sênior, sr, staff, principal, lead, líder, head, manager, gerente, diretor, director, coordenador, coordenação, especialista, master, arquiteto, arquiteta, architect, "iii", "iv"]

# A vaga passa no filtro de local se a localização/modalidade contém algum destes termos
filtro_local:
  aceitar: [remote, remoto, remota, home office, brasil, brazil, latam, "latin america", "south america", anywhere]
  # se aceitar contiver "brasil" mas a vaga for presencial (ex. "São Paulo - Presencial"), ela é descartada
  exigir_remoto: true

# Busca pública no LinkedIn (sem login, filtrada em Remoto no Brasil)
linkedin:
  ultimos_dias: 5            # só vagas frescas (últimos 5 dias)
  max_candidatos: 100        # descarta vagas com +100 candidatos
  max_por_busca: 25

# Filtro para o Portal Gupy (evita vagas antigas já lotadas com +100 candidatos)
gupy:
  ultimos_dias: 5            # só vagas recém-abertas (últimos 5 dias)
  queries:
    - 'Desenvolvedor Java Junior'
    - 'Desenvolvedor PHP'
    - 'Desenvolvedor Angular'
    - 'Desenvolvedor Full Stack Junior'
    - 'Desenvolvedor React Junior'
    - 'Desenvolvedor React Native'
    - 'Desenvolvedor Mobile Junior'
    - 'Desenvolvedor Backend Junior'
    - 'Desenvolvedor Front-end Junior'
    - 'Analista de Suporte Junior'
    - 'Suporte Técnico TI'
    - 'Java Angular'
    - 'PHP Laravel'

matching:
  top_n_ia: 25               # quantas vagas (melhores na etapa 1) a IA avalia por execução
  similaridade_minima: 0.50  # corte da etapa 1 (0 a 1)

coleta:
  auto_horas: 6              # atualiza as vagas sozinho a cada X horas enquanto o painel/servidor estiver aberto (0 = desativa)
  intervalo_segundos: 0.4
  timeout_segundos: 25

# Empresas extras: URL da página de carreiras OU "ats:slug" (ex. greenhouse:stone)
# Rode `python run.py importar-empresas` depois de editar.
empresas: []
